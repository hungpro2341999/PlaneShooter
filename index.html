<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlaneShooter — Web 3D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #87b5d6; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      .hud { position: fixed; z-index: 10; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.55); pointer-events: none; }
      #fps { top: 10px; left: 12px; font: 600 14px/1.3 ui-monospace, monospace; white-space: pre; }
      #help { left: 12px; bottom: 10px; font-size: 12.5px; line-height: 1.5; opacity: .92; }
      #status { top: 10px; right: 12px; text-align: right; font: 600 13px/1.5 ui-monospace, monospace; }
      #boostWrap { width: 150px; height: 8px; margin-left: auto; background: rgba(255,255,255,.25); border-radius: 4px; overflow: hidden; }
      #boostBar { height: 100%; width: 100%; background: #ffd34d; transition: width .08s linear; }
      #crosshair { left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 20px; opacity: .8; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="hud" id="fps">FPS: --</div>
    <div class="hud" id="status">SPD: --<br/>BOOST<div id="boostWrap"><div id="boostBar"></div></div></div>
    <div class="hud" id="crosshair">+</div>
    <div class="hud" id="help">
      Chuột: lái (pitch/yaw) &nbsp;•&nbsp; W/S: tăng/giảm ga &nbsp;•&nbsp; A/D: liệng (roll)<br/>
      Shift: tăng tốc (có hồi chiêu) &nbsp;•&nbsp; Tay cầm: stick trái lái, RT/LT ga, LB liệng, A tăng tốc
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
