name: Import bash.tv build (one-off)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download and verify source from bash.tv
        run: |
          curl -fsSL -o /tmp/src.zip "https://3000-03h1h9nvfafs5eph49oc71dvm.proxy.onbash.tv/planeshooter-src.zip"
          echo "b5b27a221c66e02edc1b1a5c0c59998d085372d5dde94648781a3aefb14efefd  /tmp/src.zip" | sha256sum -c -
          mkdir -p /tmp/src && unzip -q /tmp/src.zip -d /tmp/src
          ls -la /tmp/src
      - name: Replace repository content (keep .git and .github)
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          SRC=/tmp/src
          if [ ! -f "$SRC/package.json" ] && [ "$(ls -A $SRC | wc -l)" = "1" ]; then SRC="$SRC/$(ls -A $SRC)"; fi
          cp -a "$SRC"/. .
          sed -i '/bash\.tv\/bash\/v1\.js/d' index.html
          grep -n 'bash.tv' index.html || echo 'no bash.tv script left'
          ls -la
      - name: Verify build
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          rm -rf dist node_modules
      - name: Commit and push to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: replace project with PlaneShooter built on bash.tv"
          git push origin HEAD:main
      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
